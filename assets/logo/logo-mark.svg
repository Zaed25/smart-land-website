<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Smart Land">
  <defs>
    <linearGradient id="slg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1F3A"/>
      <stop offset="1" stop-color="#0F766E"/>
    </linearGradient>
  </defs>
  <!-- the land plot: rounded square -->
  <rect x="6" y="6" width="84" height="84" rx="24" fill="url(#slg)"/>
  <!-- horizon line of the land -->
  <path d="M18 70 Q48 60 78 70" fill="none" stroke="#2DD4BF" stroke-width="3" stroke-linecap="round" opacity=".55"/>
  <!-- circuit shaped S -->
  <path d="M68 28 H40 a11 11 0 0 0 0 22 H56 a11 11 0 0 1 0 22 H28" fill="none" stroke="#fff" stroke-width="7"
        stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="68" cy="28" r="6.5" fill="#2DD4BF" stroke="#fff" stroke-width="3"/>
  <circle cx="28" cy="72" r="6.5" fill="#2DD4BF" stroke="#fff" stroke-width="3"/>
  <!-- AI spark -->
  <circle cx="23" cy="23" r="3.6" fill="#5EEAD4"/>
</svg>
